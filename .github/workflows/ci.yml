name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verificar sintaxe
        run: |
          node --check server.js
          node --check robo.js
          node --check spot-engine.js
          node --check db.js
          node --check public/app.js
      - name: Testes
        run: npm test
      - name: Contrato das rotas
        run: npm run rotas
      - name: Dependências
        run: npm audit --audit-level=high
